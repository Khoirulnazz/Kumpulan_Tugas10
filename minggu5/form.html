<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Register IT Club</h1>
<form action="">
    <label for="nama">Nama:</label>
    <input type="text" required> 
    <br>
    <br>
    <br>
    <label for="email">Email:</label>
    <input type="email" required>
    <br>
    <br>
    <br>
    <label for="password">password:</label>
    <input type="password" required>
    <br>
    <br>
    <br>
    <label for="jeniskelamin">Jenis kelamin</label>
    <br>
    <input type="radio" value="lakilaki" name="jeniskelamin"> 
    <label for="lakilaki">Laki-laki</label>
    <input type="radio" value="Perempuan" name="jeniskelamin">
    <label for="Perempuan">Perempuan</label>
    <br>
    <br>
    <label for="skill">kemampuan yang ingin di pelajari</label>
    <br>
    <input type="checkbox" value="html" name="skill">
    <label for="html">HTML</label>
    <input type="checkbox" value="css" name="skill">
    <label for="css">CSS</label>
    <input type="checkbox" value="javascript" name="skill">
    <label for="javascript">JavaScript</label>
    <br>
    <br>
    <label for="alasan">Alasan</label>
    <br>
    <textarea name="Alasan" cols="30" rows="5"></textarea>
    <br>
    <br>
    <br>
    <br>
    <label for="reset">Ulangi Pengisian:</label>
    <br>
    <br>
    <input type="reset">
    <br>
    <br>
    <br>
    <br>
<input type="submit" name="submit" value="Daftar">

</form>



</body>
</html>
