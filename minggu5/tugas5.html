<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Register Club Celtic Glasgow</h1>
    <label for="nama"> Name:</label>
    <input type="text" required>
    <br>
    <br>
    <label for="name1">Name manager</label>
    <input type="text" name="name1">
    <br>
    <br>
    <label for="email">Email:</label>
    <input type="email" required>
    <br>
    <br>
    <label for="password">No Telepon</label>
    <input type="password">
    <br>
    <br>
    <label for="harga">Harga kontrak</label>
    <input type="number" required>
    <br>
    <br>
    <label for="jeniskelamin">Jenis kelamin</label>
    <br>
    <input type="radio" value="lakilaki" name="jeniskelamin">
    <label for="jeniskelamin">Laki-laki</label>
    <input type="radio" value="Perempuan" name="jeniskelamin">
    <label for="Perempuan">Perempuan</label>
    <br>
    <br>
    <label for="skill">Minimum skill Pemain:</label>
    <br>
    <input type="checkbox" value="MengControl bola" name="skill">
    <label for="MengControl">MengControl bola</label>
    <input type="checkbox" value="Shooting jarak dekat" name="skill">
    <label for="Shooting jarak dekat">Shooting jarak dekat</label>
    <input type="checkbox" value="Lari secepat 3km/jam">
    <label for="Lari secepat 3km/jam">Lari secepat 3km/jam</label>
    <br>
    <br>
    <label for="alasan">Alasan Masuk Club</label>
    <br>
    <textarea name="alasan" id="" cols="50" rows="5"></textarea>
    <br>
    <br>
    <label for="reset">Reset Formulir Pendaftaran</label>
    <input type="reset" name="reset" value="Click here">
    <br>
    <br>
    <input type="submit" name="submit" value="kirim pendaftaran">
</body>
</html>
